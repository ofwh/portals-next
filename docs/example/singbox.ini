[custom]
; 路径相对于应用运行目录；以下假定从仓库根目录启动。
singbox_rule_base=example/singbox.json
enable_rule_generator=true
overwrite_original_rules=true

; 策略组：反引号分隔，[] 表示引用已有出站或策略组，.* 匹配订阅节点。
custom_proxy_group=Proxy`select`[]Auto`[]DIRECT`.*
custom_proxy_group=Auto`url-test`.*`https://www.gstatic.com/generate_204`300
custom_proxy_group=Domestic`select`[]DIRECT`[]Proxy
custom_proxy_group=Media`select`[]Proxy`[]Auto`[]DIRECT
custom_proxy_group=Final`select`[]Proxy`[]DIRECT

; 内联规则：策略名,[]规则类型,规则值；按配置顺序处理。
ruleset=DIRECT,[]DOMAIN-SUFFIX,local.example.com
ruleset=Domestic,[]DOMAIN-SUFFIX,cn
ruleset=Domestic,[]IP-CIDR,192.168.0.0/16
ruleset=Media,[]DOMAIN-SUFFIX,media.example.com
ruleset=Final,[]FINAL,Final
