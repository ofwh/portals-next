; 目标：clash。使用方式及节点前提见 README.md。
[custom]

; 参数格式：<…> 为需要替换的值；方括号表示可选部分，成员引用前缀 [] 除外。
; 手动：custom_proxy_group=<组名>`select`<成员>[`<成员>…]
; 检测：custom_proxy_group=<组名>`<url-test|fallback|load-balance|smart>`<成员>[`<成员>…]`<检测URL>`<检测间隔>[,<超时>[,<容差>]]
; 链式：custom_proxy_group=<组名>`relay`[]<节点名>[`[]<节点名>…]
; 组名：非空且唯一，不能与节点或内置动作重名。
; 成员：[]名称引用节点、组或内置动作；普通文本为节点名称正则。
; 筛选成员也可用 !!TYPE=<协议正则>[!!<名称正则>]、!!SERVER=<地址正则>[!!<名称正则>]、!!PORT=<端口范围>[!!<名称正则>]。
; 成员至少有一个有效结果；组引用必须存在且无循环，relay 按固定节点顺序配置。
; 内置动作引用使用 []DIRECT、[]REJECT。
; 检测URL：有效 HTTP(S) URL；检测间隔以秒计，定时组须为正安全整数。
; 超时、容差：非负安全整数。
; 省略超时但填写容差时，时间段写为 <间隔>,,<容差>。
; 完整检测参数用于 url-test；手动组不设置检测字段。

; 最小配置：单个内置成员。
custom_proxy_group=Manual`select`[]DIRECT

; 完整配置：延迟组显式提供 URL、间隔、超时和容差。
custom_proxy_group=Latency`url-test`^(HK|SG)-`https://example.com/generate_204`300,5,50

; 关联配置：fallback 按成员顺序故障转移，检测 URL 与正间隔配套。
custom_proxy_group=Fallback`fallback`[]HK-01`[]SG-01`https://example.com/generate_204`60

; 关联配置：load-balance 同样需要检测 URL 与正间隔。
custom_proxy_group=Balance`load-balance`^(HK|SG)-`https://example.com/generate_204`300

; 关联配置：relay 使用有序节点引用，不能用名称筛选代替固定顺序。
custom_proxy_group=Relay`relay`[]HK-01`[]SG-01

; 关联配置：smart 在配方解析中也需要 URL 与间隔。
custom_proxy_group=Smart`smart`^(HK|SG)-`https://example.com/generate_204`300
