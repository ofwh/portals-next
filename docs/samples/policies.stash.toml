# 目标：stash。使用方式及节点前提见 README.md。
# 当前示例使用可贯通生成的 select 与 relay。
# select 显式 timeout=0，避免解析器补入默认超时。

# 参数格式：<…> 为需要替换的值；方括号表示可选部分，成员引用前缀 [] 除外。
# 每项使用 [[custom_groups]]。
# 手动：name = "<组名>"；type = "select"；rule = ["<成员>", …]；timeout = 0。
# 链式：name = "<组名>"；type = "relay"；rule = ["[]<节点名>", …]；timeout = 0。
# relay 的检测扩展：url = "<检测URL>"；interval = <检测间隔>；timeout = <超时>，不设置 tolerance。
# TOML 省略 timeout 时解析器补 5；不需要超时字段的模式显式写 0。
# 组名：非空且唯一，不能与节点或内置动作重名。
# 成员：[]名称引用节点、组或内置动作；普通文本为节点名称正则。
# 筛选成员也可用 !!TYPE=<协议正则>[!!<名称正则>]、!!SERVER=<地址正则>[!!<名称正则>]、!!PORT=<端口范围>[!!<名称正则>]。
# 成员至少有一个有效结果；组引用必须存在且无循环，relay 按固定节点顺序配置。
# 内置动作引用使用 []DIRECT、[]REJECT。
# 检测URL：有效 HTTP(S) URL；检测间隔以秒计，定时组须为正安全整数。
# 超时、容差：非负安全整数。

# 最小配置：单个内置成员。
[[custom_groups]]
name = "Manual"
type = "select"
rule = ["[]DIRECT"]
timeout = 0

# 完整配置：手动组组合节点、组引用、名称筛选和内置动作。
[[custom_groups]]
name = "Selection"
type = "select"
rule = ["[]Manual", "[]HK-01", "^SG-", "[]REJECT"]
timeout = 0

# 关联配置：relay 使用有序节点引用，不能用名称筛选代替固定顺序。
[[custom_groups]]
name = "Relay"
type = "relay"
rule = ["[]HK-01", "[]SG-01"]
timeout = 0

# 关联配置：TOML 的 relay 可同时声明 benchmark URL、间隔和非零超时。
[[custom_groups]]
name = "RelayBenchmark"
type = "relay"
rule = ["[]HK-01", "[]SG-01"]
url = "https://example.com/generate_204"
interval = 300
timeout = 5
