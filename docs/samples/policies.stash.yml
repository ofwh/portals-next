# 目标：stash。使用方式及节点前提见 README.md。
# 当前示例使用可贯通生成的 select 与 relay。
custom:
  proxy_groups:
    # 参数格式：<…> 为需要替换的值；方括号表示可选部分，成员引用前缀 [] 除外。
    # 每项位于 custom.proxy_groups 数组。
    # 手动：{name: <组名>, type: select, rule: ["<成员>", …]}
    # 链式使用字符串："<组名>`relay`[]<节点名>[`[]<节点名>…]"。
    # 组名：非空且唯一，不能与节点或内置动作重名。
    # 成员：[]名称引用节点、组或内置动作；普通文本为节点名称正则。
    # 筛选成员也可用 !!TYPE=<协议正则>[!!<名称正则>]、!!SERVER=<地址正则>[!!<名称正则>]、!!PORT=<端口范围>[!!<名称正则>]。
    # 成员至少有一个有效结果；组引用必须存在且无循环，relay 按固定节点顺序配置。
    # 内置动作引用使用 []DIRECT、[]REJECT。

    # 最小配置：单个内置成员。
    - name: Manual
      type: select
      rule:
        - '[]DIRECT'

    # 完整配置：手动组组合节点、组引用、名称筛选和内置动作。
    - name: Selection
      type: select
      rule:
        - '[]Manual'
        - '[]HK-01'
        - ^SG-
        - '[]REJECT'

    # 关联配置：relay 使用有序节点引用，不能用名称筛选代替固定顺序。
    - Relay`relay`[]HK-01`[]SG-01
