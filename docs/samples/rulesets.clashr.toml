# 目标：clashr。资源占位地址、来源格式及策略引用见 README.md。

# 参数格式：<…> 为需要替换的值；方括号表示可选部分，内联前缀 [] 除外。
# 每项使用 [[rulesets]]。
# 内联：group = "<策略名称>"；ruleset = "[]<规则类型>,<匹配值>"。
# 兜底：group = "<策略名称>"；ruleset = "[]FINAL"。
# 远程：group = "<策略名称>"；type = "<来源格式>"；ruleset = "<HTTP(S)地址>"。
# 远程可选：interval = <下载间隔>；options = ["<选项>", …]。
# type 使用 surge-ruleset / quantumultx / clash-domain / clash-ipcidr / clash-classic，按正文选取；URL 不带格式前缀。
# 策略名称：已定义的节点、策略组或内置动作，按名称绑定；条件中不重复附加策略。
# 规则类型、匹配值：由目标转换器支持的条件组成；FINAL 不带匹配值，且只放在末尾。
# HTTP(S)地址：可下载的规则资源 URL；下载间隔为非负安全整数，省略时为 86400。
# no-resolve：只用于 IP-CIDR、IP-CIDR6、GEOIP 条件；远程资源的每条条件均须符合限制。

# 最小配置：策略与单条内联条件。
[[rulesets]]
group = "DIRECT"
ruleset = "[]DOMAIN,api.example.org"

# 完整配置：IP YAML 来源、策略、下载间隔与 no-resolve。正文为 payload: ["192.0.2.0/24"]。
[[rulesets]]
group = "Manual"
type = "clash-ipcidr"
ruleset = "https://example.com/rules/ipcidr.yaml"
interval = 43200
options = ["no-resolve"]

# 关联配置：域名 YAML 使用 clash-domain。正文为 payload: [api.example.org, +.example.net]。
[[rulesets]]
group = "Manual"
type = "clash-domain"
ruleset = "https://example.com/rules/domains.yaml"
interval = 43200

# 关联配置：兜底只保留一条，放在所有规则之后。
[[rulesets]]
group = "Manual"
ruleset = "[]FINAL"
