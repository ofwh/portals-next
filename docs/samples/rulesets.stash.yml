# 目标：stash。资源占位地址、来源格式及策略引用见 README.md。
custom:
  rulesets:
    # 参数格式：<…> 为需要替换的值；方括号表示可选部分，内联前缀 [] 除外。
    # 每项位于 custom.rulesets 数组。
    # 内联：{group: <策略名称>, rule: "<规则类型>,<匹配值>"}
    # 兜底：{group: <策略名称>, rule: FINAL}
    # 远程：{group: <策略名称>, ruleset: "<来源格式>:<HTTP(S)地址>"}
    # 远程可选：interval: <下载间隔>；options: ["<选项>", …]。
    # rule 与 ruleset 选择一种；来源格式写在 ruleset 前缀，不另写 type。
    # 策略名称：已定义的节点、策略组或内置动作，按名称绑定；条件中不重复附加策略。
    # 规则类型、匹配值：由目标转换器支持的条件组成；FINAL 不带匹配值，且只放在末尾。
    # 来源格式：surge / quanx / clash-domain / clash-ipcidr / clash-classic，描述资源正文而非输出类型。
    # HTTP(S)地址：可下载的规则资源 URL；下载间隔为非负安全整数，省略时为 86400。
    # no-resolve：只用于 IP-CIDR、IP-CIDR6、GEOIP 条件；远程资源的每条条件均须符合限制。
    # stash-format=yaml|text|mrs：同一来源只能选一个资源格式，省略时按 YAML 读取 Clash 来源。
    # mrs 只与 clash-domain / clash-ipcidr 配套，使用原生 provider，不能同时使用 no-resolve。

    # 最小配置：策略与单条内联条件。
    - group: DIRECT
      rule: DOMAIN,api.example.org

    # 完整配置：纯文本 IP 来源，同时声明资源格式与 no-resolve；正文每行一个 CIDR。
    - group: Manual
      ruleset: clash-ipcidr:https://example.com/rules/ipcidr.txt
      interval: 43200
      options:
        - no-resolve
        - stash-format=text

    # 关联配置：MRS 域名资源使用 domain 行为，由原生 provider 引用。
    - group: Manual
      ruleset: clash-domain:https://example.com/rules/domains.mrs
      interval: 43200
      options:
        - stash-format=mrs

    # 关联配置：MRS IP 资源使用 ipcidr 行为，由原生 provider 引用。
    - group: DIRECT
      ruleset: clash-ipcidr:https://example.com/rules/ipcidr.mrs
      interval: 43200
      options:
        - stash-format=mrs

    # 关联配置：兜底只保留一条，放在所有规则之后。
    - group: Manual
      rule: FINAL
