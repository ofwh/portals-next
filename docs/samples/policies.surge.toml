# 目标：surge。使用方式及节点前提见 README.md。
# select 显式 timeout=0，避免解析器补入默认超时。

# 参数格式：<…> 为需要替换的值；方括号表示可选部分，成员引用前缀 [] 除外。
# 每项使用 [[custom_groups]]。
# 手动：name = "<组名>"；type = "select"；rule = ["<成员>", …]；timeout = 0。
# 检测：name = "<组名>"；type = "<url-test|fallback|load-balance>"；rule = ["<成员>", …]。
# 检测必填：url = "<检测URL>"；interval = <检测间隔>。
# 检测可选：timeout = <超时>；tolerance = <容差>。
# TOML 省略 timeout 时解析器补 5；不需要超时字段的模式显式写 0。
# 组名：非空且唯一，不能与节点或内置动作重名。
# 成员：[]名称引用节点、组或内置动作；普通文本为节点名称正则。
# 筛选成员也可用 !!TYPE=<协议正则>[!!<名称正则>]、!!SERVER=<地址正则>[!!<名称正则>]、!!PORT=<端口范围>[!!<名称正则>]。
# 成员至少有一个有效结果；组引用必须存在且无循环。
# 内置动作引用使用 []DIRECT、[]REJECT。
# 检测URL：有效 HTTP(S) URL；检测间隔以秒计，定时组须为正安全整数。
# 超时、容差：非负安全整数。
# 完整检测参数用于 url-test；手动组不设置检测字段。

# 最小配置：单个内置成员。
[[custom_groups]]
name = "Manual"
type = "select"
rule = ["[]DIRECT"]
timeout = 0

# 完整配置：延迟组显式提供 URL、间隔、超时和容差。
[[custom_groups]]
name = "Latency"
type = "url-test"
rule = ["^(HK|SG)-"]
url = "https://example.com/generate_204"
interval = 300
timeout = 5
tolerance = 50

# 关联配置：fallback 按成员顺序故障转移，检测 URL 与正间隔配套。
[[custom_groups]]
name = "Fallback"
type = "fallback"
rule = ["[]HK-01", "[]SG-01"]
url = "https://example.com/generate_204"
interval = 60

# 关联配置：load-balance 同样需要检测 URL 与正间隔。
[[custom_groups]]
name = "Balance"
type = "load-balance"
rule = ["^(HK|SG)-"]
url = "https://example.com/generate_204"
interval = 300
