# 目标：singbox。资源占位地址、来源格式及策略引用见 README.md。

# 参数格式：<…> 为需要替换的值；方括号表示可选部分，内联前缀 [] 除外。
# 每项使用 [[rulesets]]。
# 内联：group = "<策略名称>"；ruleset = "[]<规则类型>,<匹配值>"。
# 兜底：group = "<策略名称>"；ruleset = "[]FINAL"。
# 远程：group = "<策略名称>"；type = "<来源格式>"；ruleset = "<HTTP(S)地址>"。
# 远程可选：interval = <下载间隔>。
# type 使用 surge-ruleset / quantumultx / clash-domain / clash-ipcidr / clash-classic，按正文选取；URL 不带格式前缀。
# 策略名称：已定义的节点、策略组或内置动作，按名称绑定；条件中不重复附加策略。
# 规则类型、匹配值：由目标转换器支持的条件组成；FINAL 不带匹配值，且只放在末尾。
# HTTP(S)地址：可下载的规则资源 URL；下载间隔为非负安全整数，省略时为 86400。

# 最小配置：策略与单条内联条件。
[[rulesets]]
group = "DIRECT"
ruleset = "[]DOMAIN,api.example.org"

# 完整配置：兼容的规则文本来源、策略与下载间隔。正文如 DOMAIN-SUFFIX,example.org。
[[rulesets]]
group = "Manual"
type = "surge-ruleset"
ruleset = "https://example.com/rules/domains.list"
interval = 43200

# 关联配置：GEOIP 的私网特例映射为 ip_is_private。
[[rulesets]]
group = "DIRECT"
ruleset = "[]GEOIP,private"

# 关联配置：拒绝流量使用规则动作，不作为策略组成员。
[[rulesets]]
group = "REJECT"
ruleset = "[]DOMAIN-SUFFIX,tracking.example.org"

# 关联配置：兜底只保留一条，放在所有规则之后。
[[rulesets]]
group = "Manual"
ruleset = "[]FINAL"
