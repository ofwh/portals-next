# 目标：surfboard。资源占位地址、来源格式及策略引用见 README.md。
custom:
  rulesets:
    # 参数格式：<…> 为需要替换的值；方括号表示可选部分，内联前缀 [] 除外。
    # 每项位于 custom.rulesets 数组。
    # 内联：{group: <策略名称>, rule: "<规则类型>,<匹配值>"}
    # 兜底：{group: <策略名称>, rule: FINAL}
    # 远程：{group: <策略名称>, ruleset: "<来源格式>:<HTTP(S)地址>"}
    # 远程可选：interval: <下载间隔>。
    # rule 与 ruleset 选择一种；来源格式写在 ruleset 前缀，不另写 type。
    # 策略名称：已定义的节点、策略组或内置动作，按名称绑定；条件中不重复附加策略。
    # 规则类型、匹配值：由目标转换器支持的条件组成；FINAL 不带匹配值，且只放在末尾。
    # 来源格式：surge / quanx / clash-domain / clash-ipcidr / clash-classic，描述资源正文而非输出类型。
    # HTTP(S)地址：可下载的规则资源 URL；下载间隔为非负安全整数，省略时为 86400。

    # 最小配置：策略与单条内联条件。
    - group: DIRECT
      rule: DOMAIN,api.example.org

    # 完整配置：兼容的规则文本来源、策略与下载间隔。正文如 DOMAIN-SUFFIX,example.org。
    - group: Manual
      ruleset: surge:https://example.com/rules/domains.list
      interval: 43200

    # 关联配置：目标端口条件输出为 DEST-PORT。
    - group: Manual
      rule: DST-PORT,443

    # 关联配置：兜底只保留一条，放在所有规则之后。
    - group: Manual
      rule: FINAL
