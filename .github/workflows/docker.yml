name: Docker build

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Determine image tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "$EVENT:$REF" in
            push:refs/heads/main)
              timestamp=$(git show -s --format=%ct HEAD)
              tag="$(date -u -d "@$timestamp" +%Y.%-m).$GITHUB_RUN_NUMBER"
              ;;
            push:refs/heads/release) tag=unstable ;;
            workflow_dispatch:*) tag=dev ;;
            *) tag="pr-$GITHUB_RUN_ID" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: app
            prefix: ''
          - target: migrate
            prefix: migrate-
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}/portals-next,enable=${{ steps.dockerhub.outcome == 'success' }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.prefix }}${{ needs.version.outputs.tag }}
            type=raw,value=${{ matrix.prefix }}latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          fi

  cleanup:
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the latest 10 completed workflow runs
        uses: igorjs/gh-actions-clean-workflow@v8
        with:
          workflow_names: ${{ github.workflow }}
          runs_older_than: '0'
          runs_to_keep: '10'
