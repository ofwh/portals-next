; Sources: Profiles/Clash/Profiles/Lite.ini (groups), Profiles/Loon/Profiles/Lite.conf (rules)

proxy_group=代理访问`select`自动选择`香港节点`新加坡节点`日本节点`美国节点`台湾节点`其他节点
proxy_group=自动选择`fallback`香港节点`新加坡节点`日本节点`美国节点`台湾节点`其他节点`url=http://www.gstatic.com/generate_204`interval=60
proxy_group=AI服务`select`代理访问`自动选择`美国节点`新加坡节点`日本节点`台湾节点`香港节点`其他节点`.*
proxy_group=Apple服务`select`DIRECT`代理访问`自动选择`香港节点`新加坡节点`日本节点`台湾节点`美国节点`其他节点
proxy_group=Google服务`select`代理访问`自动选择`香港节点`新加坡节点`美国节点`日本节点`台湾节点`其他节点
proxy_group=Microsoft服务`select`代理访问`自动选择`香港节点`新加坡节点`日本节点`台湾节点`美国节点`其他节点`DIRECT
proxy_group=Telegram服务`select`代理访问`自动选择`香港节点`新加坡节点`日本节点`台湾节点`美国节点`其他节点
proxy_group=直连访问`select`DIRECT`代理访问`自动选择
proxy_group=禁止访问`select`REJECT`DIRECT`代理访问`自动选择
proxy_group=规则之外`select`代理访问`自动选择`美国节点`新加坡节点`日本节点`台湾节点`香港节点`其他节点
proxy_group=香港节点`url-test`(港|HK|Hong Kong)`url=http://www.gstatic.com/generate_204`interval=300`tolerance=50
proxy_group=新加坡节点`url-test`(新|狮城|SG|Singapore)`url=http://www.gstatic.com/generate_204`interval=300`tolerance=50
proxy_group=日本节点`url-test`(日|东京|大阪|埼玉|JP|Japan)`url=http://www.gstatic.com/generate_204`interval=300`tolerance=50
proxy_group=台湾节点`url-test`(台|新北|彰化|TW|Taiwan)`url=http://www.gstatic.com/generate_204`interval=300`tolerance=50
proxy_group=美国节点`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`url=http://www.gstatic.com/generate_204`interval=300`tolerance=50
proxy_group=其他节点`url-test`(^(?!.*(港|HK|新|SG|日|JP|台|TW|美|US)).*)`url=http://www.gstatic.com/generate_204`interval=300`tolerance=50

