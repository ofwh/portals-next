[general]
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 3000
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com
geo_location_checker = disabled
profile_img_url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/Godetia.png
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8
udp_drop_list = 443, STUN, QUIC


[dns]
no-ipv6
no-system
server=119.29.29.29
server=223.5.5.5
server=114.114.114.114
server=/*.icloud.com/119.29.29.29
server=/*.icloud.com.cn/119.29.29.29
server=/*.tencent.com/119.29.29.29
server=/*.weixin.com/119.29.29.29


[policy]


[server_remote]


[filter_remote]


[rewrite_remote]


[server_local]


[filter_local]


[rewrite_local]


[task_local]


[http_backend]


[mitm]
skip_validating_cert = true
force_sni_domain_name = false
# 当使用 Quantumult X 在 M 芯片的 Mac 设备上作为局域网网关时，使用下面的参数来 跳过某些特定设备的 mitm 需求
; skip_src_ip = 192.168.1.50, 192.168.1.100
