; sing-box 规则与策略配置
; 解析：format=ini、transformer=singbox；编译：target=singbox。
; 代理协议节点由订阅输入提供；JSON 基础模板单独经模板解析节点接入编译节点。
; 完整约定见 docs/rebuild/ruleset/sing-box 核心配置简表.md。
; <…> 为占位值，[…] 为可选部分；成员前的 [] 为实际语法。

[custom]

; 配置格式：节点组
; custom_proxy_group=<组名>`select`<成员1>`<成员2>...
; custom_proxy_group=<组名>`selector`<成员1>`<成员2>...`<true|false>
; custom_proxy_group=<组名>`url-test`<成员1>`<成员2>...[`<测速URL>`<间隔秒数>,,<容差毫秒>]
; select/selector 输出 selector，url-test/urltest 输出 urltest；其他分组类型不支持。
; []名称精确引用节点或组，普通正则仅筛选实际输出的订阅节点。
; selector 的布尔尾段对应 interrupt_exist_connections；select 不截取该尾段。
; 测速尾部可整体省略，各参数也可留空；未设置字段不输出，中间 timeout 不输出。
; 正则未匹配到成员时保留空数组，不自动补 DIRECT；核心可因此拒绝加载配置。

; 示例：选择组、嵌套引用、正则筛选，以及显式 true/false。
custom_proxy_group=手动选择`selector`[]自动选择`[]测速示例`.*`[]DIRECT`true
custom_proxy_group=AI服务`select`[]手动选择`[]自动选择
custom_proxy_group=规则之外`selector`[]手动选择`[]DIRECT`false

; 示例：省略测速参数，由核心兜底；或显式设置 URL、60 秒和 50ms 容差。
custom_proxy_group=自动选择`url-test`.*
custom_proxy_group=测速示例`urltest`.*`https://www.gstatic.com/generate_204`60,,50

; 配置格式：远程规则集
; ruleset=<策略可空>,singbox-<kind>:<URL>[,<更新秒数>[,<tag>[,<下载出站>]]]
; kind 为 source 或 binary；仅接受 HTTP(S) URL。
; 空策略只定义资源；非空策略同时定义资源并在该位置生成路由引用。
; 更新周期省略或留空时，解析与编译结果均不输出对应字段，由核心兜底；tag 缺省时自动命名。
; 跨条目引用时显式填写 tag；填写后续字段时，保留中间空位的逗号。
; 下载出站独立于路由策略，未设置时不输出 download_detour。
; 模板与声明中的同 tag 定义必须等价，否则报冲突错误。

; 示例：source 规则集仅定义，保留空间隔，显式指定 tag 和下载出站。
ruleset=,singbox-source:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/cn.json,,geosite-cn,手动选择
ruleset=,singbox-source:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geoip/cn.json,,geoip-cn,手动选择

; 示例：binary 规则集仅定义；第一条显式设置更新周期，其余省略周期字段。
ruleset=,singbox-binary:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/18comic.srs,86400,geosite-18comic,手动选择
ruleset=,singbox-binary:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/category-ads-all.srs,,geosite-category-ads-all,手动选择
ruleset=,singbox-binary:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/geolocation-!cn.srs,,geosite-!cn,手动选择

; 配置格式：通用来源、内联匹配、规则集引用和最终出站
; ruleset=<策略>,<通用来源>[,<更新秒数>]
; ruleset=<策略>,[]<规则类型>,<值>
; ruleset=<策略>,[]RULE-SET,<tag1>[,<tag2>...]
; ruleset=<最终出站>,[]FINAL
; 通用来源可使用无前缀、surge:、quanx:、clash-domain:、clash-ipcidr:、clash-classic:。
; 通用资源由应用端获取正文后转换；原生 remote 不在应用端下载展开。
; 策略引用节点、分组或 DIRECT；REJECT 生成拒绝动作，不创建同名出站。
; 多个 RULE-SET tag 保持为一条路由规则，引用的 tag 必须已定义，可先引用后定义。
; 私有地址使用 PRIVATE，不使用 GEOIP/GEOSITE/SRC-GEOIP；最终出站不接受 REJECT。
; 模板保留的路由在前，本文路由按声明顺序追加；不自动生成 GLOBAL 或 Clash 模式规则。

; 示例：基础匹配；按实际需要启用以下 DOMAIN-SUFFIX、IP-CIDR 示例。
ruleset=DIRECT,[]PRIVATE,true
; ruleset=DIRECT,[]DOMAIN-SUFFIX,example.com
; ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16

; 示例：拒绝与多规则集引用。
ruleset=REJECT,[]RULE-SET,geosite-category-ads-all,personal-ad-block
ruleset=手动选择,[]RULE-SET,personal-proxy,personal-specify-proxy,geosite-18comic

; 示例：非空策略同时定义 binary 资源并生成一条路由引用。
ruleset=AI服务,singbox-binary:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/category-ai-!cn.srs,,geosite-global-ai,手动选择

; 示例：分组转发与直连。
ruleset=规则之外,[]RULE-SET,geosite-!cn
ruleset=DIRECT,[]RULE-SET,personal-direct,geosite-cn,geoip-cn

; 示例：未指定下载出站的写法；使用前替换 URL 并取消注释。
; ruleset=,singbox-source:https://example.com/direct.json,,extra-direct
; ruleset=DIRECT,[]RULE-SET,extra-direct

; FINAL 必须是最后一条有效规则声明；未声明 FINAL 时保留模板原有 final。
ruleset=规则之外,[]FINAL
